version: '3.8'

services:
  # ==========================================
  # Backend Express.js Microservice
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hirepilot-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - MONGODB_URL=${MONGODB_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ==========================================
  # Frontend React 19 SPA (Nginx)
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:8000}
        - VITE_FIREBASE_APIKEY=${VITE_FIREBASE_APIKEY}
        - VITE_RAZORPAY_KEY_ID=${VITE_RAZORPAY_KEY_ID}
    container_name: hirepilot-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
