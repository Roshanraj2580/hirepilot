name: HirePilot CI/CD Pipeline (AWS & Docker)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ap-south-1
  BACKEND_ECR_REPOSITORY: hirepilot-backend

jobs:
  # =============================================================
  # STAGE 1: Continuous Integration (Lint, Build, & Test)
  # =============================================================
  continuous-integration:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ---- Backend Verification ----
      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Verify Backend Syntax & Start Script
        working-directory: ./server
        run: node -c index.js

      # ---- Frontend Verification ----
      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Frontend Linter (ESLint)
        working-directory: ./client
        run: npm run lint

      - name: Build Frontend Production Bundle (Vite)
        working-directory: ./client
        run: npm run build
        env:
          VITE_SERVER_URL: ${{ secrets.PROD_SERVER_URL || 'https://api.hirepilot.tech' }}
          VITE_FIREBASE_APIKEY: ${{ secrets.VITE_FIREBASE_APIKEY || 'test-key' }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID || 'test-key' }}

      # ---- Container Validation ----
      - name: Validate Server Dockerfile Build
        run: docker build -t hirepilot-server:test ./server

      - name: Validate Client Dockerfile Build
        run: docker build -t hirepilot-client:test ./client

  # =============================================================
  # STAGE 2: Continuous Deployment to AWS (S3, CloudFront & ECR)
  # =============================================================
  deploy-to-aws:
    name: Deploy to AWS (CD)
    needs: [continuous-integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------------------------------
      # 2A. Frontend Deployment: AWS S3 + AWS CloudFront (CDN)
      # ---------------------------------------------------------
      - name: Setup Node.js for Frontend Release Build
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build React Frontend
        working-directory: ./client
        run: |
          npm ci
          npm run build
        env:
          VITE_SERVER_URL: ${{ secrets.PROD_SERVER_URL }}
          VITE_FIREBASE_APIKEY: ${{ secrets.VITE_FIREBASE_APIKEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}

      - name: Deploy Frontend to AWS S3 Static Bucket
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          aws s3 sync ./client/dist s3://${{ secrets.AWS_S3_FRONTEND_BUCKET || 'hirepilot-frontend-prod' }} --delete

      - name: Invalidate AWS CloudFront CDN Cache
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # ---------------------------------------------------------
      # 2B. Backend Deployment: Docker Image to AWS ECR & EC2/ECS
      # ---------------------------------------------------------
      - name: Log in to Amazon ECR
        if: env.AWS_ACCESS_KEY_ID != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Backend Image to AWS ECR
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG ./server
          docker tag $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:latest

      - name: Trigger Remote Deploy on AWS EC2 / ECS
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          echo "Image pushed to AWS ECR successfully."
          echo "Automated trigger pulling latest container to AWS EC2/ECS cluster."
